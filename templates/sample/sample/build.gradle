apply plugin: 'com.android.application'

android {
    compileSdkVersion 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.tritondigital.sample'
}
repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
      dirs 'libs'
    }
}
dependencies {
    api(name: "$TRITON_SDK", ext:'aar')
    api 'com.google.android.gms:play-services-base:17.5.0'
    api 'com.google.android.gms:play-services-cast:19.0.0'
    api 'com.google.android.gms:play-services-analytics:17.0.0'
    api 'androidx.media3:media3-exoplayer:1.6.1'
    api 'androidx.media3:media3-exoplayer-hls:1.6.1'
}
